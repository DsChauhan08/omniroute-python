<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omniroute-lite</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; color: #000; background: #fff;
         max-width: 720px; margin: 0 auto; padding: 16px; font-size: 17px; }
  header { display: flex; align-items: center; gap: 10px; border-bottom: 3px solid #000;
           padding-bottom: 10px; margin-bottom: 12px; }
  header b { font-size: 22px; }
  .dot { font-size: 20px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  nav button { flex: 1 1 auto; }
  button, input, select { font-size: 17px; padding: 12px; border: 2px solid #000;
                          background: #fff; color: #000; border-radius: 8px; min-height: 48px; }
  button { cursor: pointer; font-weight: 700; }
  button.primary { background: #000; color: #fff; }
  button:disabled { opacity: .4; }
  input, select { width: 100%; margin: 4px 0 8px; }
  label { font-weight: 700; }
  .card { border: 2px solid #000; border-radius: 10px; padding: 12px; margin: 10px 0; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; }
  .tag { border: 2px solid #000; border-radius: 6px; padding: 1px 8px; font-size: 14px; font-weight: 700; }
  .tag.inv { background: #000; color: #fff; }
  .big3 { display: flex; gap: 10px; }
  .big3 div { flex: 1; border: 2px solid #000; border-radius: 10px; padding: 10px; text-align: center; }
  .big3 b { font-size: 34px; display: block; }
  .keybox { font-size: 20px; font-weight: 700; word-break: break-all; border: 3px solid #000;
            border-radius: 10px; padding: 14px; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border-bottom: 1px solid #000; padding: 8px 4px; text-align: left; }
  section { display: none; }
  section.on { display: block; }
  .muted { opacity: .65; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc;
             border-top-color: #000; border-radius: 50%; animation: c-spin .6s linear infinite;
             vertical-align: middle; margin-left: 6px; }
  @keyframes c-spin { to { transform: rotate(360deg); } }
</style>
<header><span class="dot" id="dot">●</span><b>omniroute</b></header>
<nav id="tabs"></nav>

<section id="s-home">
  <div class="big3">
    <div><b id="h-apis">–</b>APIs</div>
    <div><b id="h-req">–</b>calls</div>
    <div><b id="h-ms">–</b>avg ms</div>
  </div>
  <div class="card grow" id="h-verdict">…</div>
</section>

<section id="s-apis">
  <div id="api-list"></div>
  <h3>Add API</h3>
  <label>Start from</label><select id="f-preset"></select>
  <label>Type</label><select id="f-kind">
    <option value="openai">openai (most APIs)</option>
    <option value="ollama">ollama</option>
    <option value="anthropic">anthropic</option>
    <option value="gemini">gemini</option>
    <option value="azure">azure</option>
    <option value="grok-web">grok-web (cookie)</option>
    <option value="claude-web">claude-web (cookie)</option>
    <option value="qwen-web">qwen-web (token)</option>
    <option value="claude-oauth">claude subscription (login)</option>
    <option value="codex-oauth">chatgpt subscription (login)</option>
  </select>
  <label>Name</label><input id="f-name" placeholder="groq">
  <label>Group (optional, shares outages)</label><input id="f-provider" placeholder="groq">
  <label>Address</label><input id="f-base" placeholder="https://…">
  <label>Key</label><input id="f-key" placeholder="paste key, or - for none">
  <label>Cookies (optional, for web logins)</label><input id="f-cookies" placeholder="session=abc; other=123">
  <label>Extra headers (optional, JSON)</label><input id="f-headers" placeholder='{"X-Foo": "bar"}'>
  <label>Models (comma apart)</label>
  <label>Version (azure only)</label><input id="f-ver" placeholder="2024-06-01">
  <div class="row"><button id="f-fetch" style="flex:1">Fetch live list</button></div>
  <div class="row"><button id="f-all" style="flex:1">All</button><button id="f-free" style="flex:1">Free only</button></div><input id="f-models" placeholder="llama-3.3-70b-versatile">
  <button class="primary" id="f-add" style="width:100%">Add</button>
  <div id="oauth-box"></div>
  <h3>Chains</h3>
  <div class="muted">Try APIs in order until one works. Use as model <b>chain:name</b>.</div>
  <div id="chain-list"></div>
  <label>Name</label><input id="ch-name" placeholder="cheap-first">
  <label>APIs in order (comma apart)</label><input id="ch-members" placeholder="groq, ollama-local">
  <button class="primary" id="ch-add" style="width:100%">Add chain</button>
</section>

<section id="s-chat">
  <label>API</label><select id="c-target"></select>
  <label>Model</label><select id="c-model"></select>
  <div class="card" id="c-out" style="white-space:pre-wrap;min-height:120px">Say hi ↓</div>
  <div class="row"><input id="c-in" class="grow" placeholder="ask anything" style="margin:0">
  <button class="primary" id="c-send">Send</button></div>
  <div style="margin-top:8px"><button id="c-clear">Clear</button></div>
</section>

<section id="s-prov">
  <input id="prov-q" placeholder="find provider or model…">
  <label class="row"><input type="checkbox" id="free-only" style="width:auto;min-height:0"> <span>Free only</span></label>
  <div id="prov-list"></div>
</section>

<section id="s-logs">
  <table><thead><tr><th>time</th><th>what</th><th>API</th><th>model</th><th>code</th><th>ms</th></tr></thead>
  <tbody id="l-rows"></tbody></table>
</section>

<section id="s-quota">
  <table><thead><tr><th>API</th><th>ok</th><th>bad</th><th>ms</th><th>state</th></tr></thead>
  <tbody id="q-rows"></tbody></table>
  <div style="margin-top:10px"><button id="q-reset">Reset counts</button></div>
</section>

<section id="s-key">
  <div class="card">Paste these two into opencode:</div>
  <div class="keybox" id="k-url">http://localhost:20128/v1</div>
  <div class="keybox" id="k-key">…</div>
  <div class="row"><button class="primary grow" id="k-copy">Copy key</button><button id="k-new">New key</button></div>
</section>

<section id="s-web">
  <div id="w-list"></div>
  <h3>Add</h3>
  <label>Address</label><input id="w-url" placeholder="https://…">
  <label class="row"><input type="checkbox" id="w-e1" checked style="width:auto;min-height:0"> <span>API down</span></label>
  <label class="row"><input type="checkbox" id="w-e2" checked style="width:auto;min-height:0"> <span>All failed</span></label>
  <button class="primary" id="w-add" style="width:100%">Add</button>
</section>

<section id="s-restart">
  <div class="card">Running for <b id="r-up">…</b>.</div>
  <button class="primary" id="r-btn" style="width:100%">Restart</button>
</section>

<script>
let K = localStorage.getItem('k') || '';
let ASKING = null;
async function keyOnce() {
  ASKING = ASKING || (async () => {
    const k = prompt('Server key:');
    if (k === null) throw new Error('no key');
    K = k; localStorage.setItem('k', k);
  })();
  try { await ASKING; } finally { ASKING = null; }
}
let PRESETS = [];
async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {'Content-Type': 'application/json',
    ...(K ? {Authorization: 'Bearer ' + K} : {})},
    body: body === undefined ? undefined : JSON.stringify(body)});
  if (r.status === 401) {
    await keyOnce();
    return api(method, path, body);
  }
  return r.json();
}
const TABS = [['home','Home'],['apis','APIs'],['prov','Providers'],['chat','Chat'],['logs','Logs'],['quota','Quota'],
              ['key','Key'],['web','Webhooks'],['restart','Restart']];
const nav = document.getElementById('tabs');
TABS.forEach(([id, name], i) => {
  const b = document.createElement('button');
  b.textContent = name; b.id = 'tab-' + id;
  if (i === 0) b.className = 'primary';
  b.onclick = () => show(id);
  nav.appendChild(b);
});
function show(id) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('on'));
  document.getElementById('s-' + id).classList.add('on');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('primary'));
  document.getElementById('tab-' + id).classList.add('primary');
  ({home: loadHome, apis: loadApis, prov: loadProv, chat: loadChat, logs: loadLogs, quota: loadQuota, key: loadKey,
    web: loadWeb, restart: loadRestart})[id]();
}
const mask = k => k ? '••••' + String(k).slice(-4) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
async function loadHome() {
  try {
    const [st, q, t] = await Promise.all([
      api('GET', '/admin/status'), api('GET', '/admin/quota'), api('GET', '/admin/targets')]);
    document.getElementById('dot').textContent = '●';
    document.getElementById('h-apis').textContent = t.targets.length;
    document.getElementById('h-req').textContent = q.stats.req;
    document.getElementById('h-ms').textContent = q.stats.avg_ms;
    const cool = Object.keys(q.state.cooldowns).length;
    const open = Object.values(q.state.breakers).filter(b => b.open_s > 0).length;
    document.getElementById('h-verdict').textContent =
      t.targets.length === 0 ? 'Add your first API ↑' :
      open ? open + ' provider resting — the rest carry on' :
      cool ? cool + ' key resting — the rest carry on' : 'All good';
  } catch (e) { document.getElementById('dot').textContent = '○'; }
}
async function loadApis() {
  const {targets} = await api('GET', '/admin/targets');
  const q = await api('GET', '/admin/quota');
  const box = document.getElementById('api-list');
  box.innerHTML = targets.length ? '' : '<div class="card">Nothing here yet. Add one below ↓</div>';
  targets.forEach(t => {
    const s = q.state.cooldowns[t.name] ? 'resting ' + q.state.cooldowns[t.name] + 's' : 'OK';
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<div class="row"><b class="grow">${esc(t.name)}</b><span class="tag">${esc(t.kind || 'openai')}</span>` +
      (t.provider ? `<span class="tag">${esc(t.provider)}</span>` : '') +
      `<span class="tag">${s}</span></div><div>${(t.models || []).map(m => `<button data-m="${esc(m)}" style="min-height:0;padding:6px 10px;margin:2px">${esc(m)}</button>`).join('')}</div>` +
      `<div class="muted">key ${mask(t.api_key)}${t.cookies ? ' · cookie ✓' : ''}</div>`;
    const r = document.createElement('div');
    r.className = 'row'; r.style.marginTop = '8px';
    const tb = document.createElement('button'); tb.textContent = 'Test';
    tb.onclick = async () => { tb.disabled = true;
      const res = await api('POST', '/admin/targets/' + encodeURIComponent(t.name) + '/test', {});
      tb.textContent = res.ok ? 'Works ✓ (' + res.latency_ms + 'ms)' : 'Fails ✕ (' + (res.reason || res.status) + ')';
      setTimeout(loadApis, 1500); };
    const del = document.createElement('button'); del.textContent = 'Remove';
    del.onclick = async () => { if (confirm('Remove ' + t.name + '?')) {
      await api('DELETE', '/admin/targets/' + encodeURIComponent(t.name)); loadApis(); } };
    r.append(tb, del); d.append(r); box.append(d);
    if ((t.kind || '').includes('oauth')) {
      const ob = document.createElement('button'); ob.textContent = 'Connect';
      ob.style.marginTop = '8px';
      ob.onclick = () => oauthPanel(t);
      const st = document.createElement('span'); st.className = 'tag'; st.textContent = '…';
      st.style.marginTop = '8px';
      api('POST', '/admin/oauth/status', {target: t.name}).then(s => {
        st.textContent = s.connected ? ('✓ ' + (s.email || 'connected')) : 'not connected'; });
      const r2 = document.createElement('div'); r2.className = 'row';
      r2.append(st, ob); d.append(r2);
    }
    d.querySelectorAll('[data-m]').forEach(mb => mb.onclick = async () => {
      mb.disabled = true;
      const res = await api('POST', '/admin/targets/' + encodeURIComponent(t.name) + '/test', {model: mb.dataset.m});
      mb.textContent = res.ok ? '✓ ' + mb.dataset.m : '✕ ' + (res.reason || res.status);
      setTimeout(loadApis, 2000); });
  });
  const {chains} = await api('GET', '/admin/chains');
  const cbox = document.getElementById('chain-list');
  cbox.innerHTML = chains.length ? '' : '<div class="card">No chains. One API is already a chain of one.</div>';
  chains.forEach(c => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<div class="row"><b class="grow">chain:${esc(c.name)}</b></div><div class="muted">${esc(c.members.join(' → '))}</div>`;
    const r = document.createElement('div');
    r.className = 'row'; r.style.marginTop = '8px';
    const tb = document.createElement('button'); tb.textContent = 'Test';
    tb.onclick = async () => { tb.disabled = true;
      const res = await api('POST', '/v1/test/call', {model: 'chain:' + c.name});
      tb.textContent = res.ok ? 'Works ✓ (' + res.target + ')' : 'Fails ✕ (' + (res.reason || res.status) + ')';
      setTimeout(loadApis, 2000); };
    const del = document.createElement('button'); del.textContent = 'Remove';
    del.onclick = async () => { if (confirm('Remove chain ' + c.name + '?')) {
      await api('DELETE', '/admin/chains/' + encodeURIComponent(c.name)); loadApis(); } };
    r.append(tb, del); d.append(r); cbox.append(d);
  });
  const sel = document.getElementById('f-preset');
  if (!sel.options.length) {
    PRESETS = (await api('GET', '/admin/presets')).presets;
    sel.append(new Option('Blank', ''));
    PRESETS.map((p, i) => [p, i]).sort((a, b) =>
      ((b[0].lite && b[0].free) - (a[0].lite && a[0].free)) || (a[0].provider < b[0].provider ? -1 : 1)
    ).forEach(([p, i]) => sel.append(new Option(p.provider + (p.free ? ' — FREE' : ''), i)));
    sel.onchange = () => { const p = PRESETS[sel.value]; if (!p) return;
      const free = p.models.filter(m => m.free);
      document.getElementById('f-models').value = (free.length ? free : p.models).map(m => m.id).join(', ');
      document.getElementById('f-kind').value = p.kind || 'openai';
      document.getElementById('f-base').value = p.base_url;

      document.getElementById('f-name').value = p.provider.split(' ')[0].toLowerCase();
      document.getElementById('f-key').placeholder =
        p.auth === 'cookie' ? 'paste browser cookie here' : 'paste key, or - for none'; };
  }
}
document.getElementById('f-fetch').onclick = async () => {
  const b = document.getElementById('f-fetch');
  b.disabled = true; b.textContent = 'Asking…';
  const p = PRESETS[document.getElementById('f-preset').value];
  const res = await api('POST', '/admin/discover', {
    kind: p ? p.kind : 'openai',
    base_url: document.getElementById('f-base').value.trim(),
    api_key: document.getElementById('f-key').value.trim() || '-'});
  b.disabled = false; b.textContent = 'Fetch live list';
  if (res.error) { alert(res.error.message); return; }
  if (!res.models.length) { alert('Company lists nothing. Type the names.'); return; }
  document.getElementById('f-models').value = res.models.join(', ');
};
function fillPresetModels(freeOnly) {
  const p = PRESETS[document.getElementById('f-preset').value];
  if (!p) { alert('Pick a provider first.'); return; }
  const ms = p.models.filter(m => !freeOnly || m.free).map(m => m.id);
  if (!ms.length) { alert('No free models listed — try Fetch live list.'); return; }
  document.getElementById('f-models').value = ms.join(', ');
}
document.getElementById('f-all').onclick = () => fillPresetModels(false);
document.getElementById('f-free').onclick = () => fillPresetModels(true);
document.getElementById('f-add').onclick = async () => {
  const t = {name: document.getElementById('f-name').value.trim(),
    base_url: document.getElementById('f-base').value.trim(),
    api_key: document.getElementById('f-key').value.trim() || '-',
    models: document.getElementById('f-models').value.split(',').map(s => s.trim()).filter(Boolean)};
  const ck = document.getElementById('f-cookies').value.trim();
  if (ck) t.cookies = ck;
  const hd = document.getElementById('f-headers').value.trim();
  if (hd) { try { t.headers = JSON.parse(hd); } catch (e) { alert('Headers must be JSON.'); return; } }
  const kind = document.getElementById('f-kind').value;
  if (kind !== 'openai') t.kind = kind;
  const pv = document.getElementById('f-provider').value.trim();
  if (pv) t.provider = pv;
  const av = document.getElementById('f-ver').value.trim();
  if (av) t.api_version = av;
  const res = await api('POST', '/admin/targets', {target: t});
  if (res.error) { alert(res.error.message); return; }
  document.querySelectorAll('#s-apis input').forEach(i => i.value = '');
  document.getElementById('f-preset').value = '';
  document.getElementById('f-kind').value = 'openai';
  loadApis();
};
document.getElementById('ch-add').onclick = async () => {
  const res = await api('POST', '/admin/chains', {chain: {
    name: document.getElementById('ch-name').value.trim(),
    members: document.getElementById('ch-members').value.split(',').map(s => s.trim()).filter(Boolean)}});
  if (res.error) { alert(res.error.message); return; }
  document.getElementById('ch-name').value = '';
  document.getElementById('ch-members').value = '';
  loadApis();
};
async function oauthPanel(t) {
  const box = document.getElementById('oauth-box');
  box.innerHTML = `<div class="card"><b>Connect ${esc(t.name)}</b><div id="oauth-body"></div></div>`;
  const body = document.getElementById('oauth-body');
  if (t.kind === 'claude-oauth') {
    const s = await api('POST', '/admin/oauth/claude_start', {target: t.name});
    if (s.error) { body.textContent = s.error.message; return; }
    body.innerHTML = `<div>1. Open <a href="${s.url}" target="_blank" rel="noopener">this login link</a></div>` +
      `<div>2. Approve, copy the code from the address bar, paste:</div>` +
      `<input id="oa-code" placeholder="code">` +
      `<div class="row"><button class="primary" id="oa-go">Finish</button>` +
      `<button id="oa-off">Disconnect</button></div>`;
    window._oa = {verifier: s.verifier, state: s.state};
    document.getElementById('oa-go').onclick = async () => {
      const r = await api('POST', '/admin/oauth/claude_finish', {target: t.name,
        code: document.getElementById('oa-code').value.trim(),
        verifier: window._oa.verifier, state: window._oa.state});
      alert(r.error ? r.error.message : ('Connected' + (r.email ? ' as ' + r.email : '')));
      loadApis();
    };
    document.getElementById('oa-off').onclick = async () => {
      await api('POST', '/admin/oauth/disconnect', {target: t});
      loadApis();
    };
  } else {
    const s = await api('POST', '/admin/oauth/codex_start', {target: t.name});
    if (s.error || !s.user_code) { body.textContent = (s.error || {}).message || 'start failed'; return; }
    body.innerHTML = `<div>1. Open <a href="${s.verification_uri}" target="_blank" rel="noopener">this page</a></div>` +
      `<div class="keybox">${esc(s.user_code)}</div><div>2. Type the code, come back, press:</div>` +
      `<div class="row"><button class="primary" id="oa-go">I've approved — check</button>` +
      `<button id="oa-off">Disconnect</button></div><div class="muted" id="oa-wait"></div>`;
    document.getElementById('oa-go').onclick = async () => {
      for (let i = 0; i < 12; i++) {
        document.getElementById('oa-wait').textContent = 'Checking… (' + (i + 1) + ')';
        const r = await api('POST', '/admin/oauth/codex_poll', {target: t.name,
          device_auth_id: s.device_auth_id, user_code: s.user_code, interval: s.interval || 5});
        if (r.error) { alert(r.error.message); return; }
        if (r.done) { alert('Connected'); loadApis(); return; }
      }
      alert('Not approved yet — press check again after approving.');
    };
    document.getElementById('oa-off').onclick = async () => {
      await api('POST', '/admin/oauth/disconnect', {target: t});
      loadApis();
    };
  }
}
async function loadProv() {
  if (!PRESETS.length) PRESETS = (await api('GET', '/admin/presets')).presets;
  const freeOnly = document.getElementById('free-only').checked;
  const box = document.getElementById('prov-list');
  box.innerHTML = '';
  const pq = document.getElementById('prov-q').value.toLowerCase();
  PRESETS.filter(p => (!freeOnly || p.free) &&
    (!pq || p.provider.toLowerCase().includes(pq) || p.models.some(m => m.id.toLowerCase().includes(pq)))).forEach(p => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<div class="row"><b class="grow">${esc(p.provider)}</b>` +
      (p.free ? '<span class="tag inv">FREE</span>' : '') + `</div>` +
      `<div class="muted">${p.note}</div><div>${p.models.map(m =>
        `<button data-pm="${m.id}" style="min-height:0;padding:6px 10px;margin:2px">${m.id}</button>` +
        (m.free ? ' <span class="tag">FREE</span>' : '')).join('<br>')}</div>`;
    const b = document.createElement('button'); b.textContent = 'Use';
    b.style.marginTop = '8px';
    b.onclick = () => { show('apis');
      document.getElementById('f-preset').value = PRESETS.indexOf(p);
      document.getElementById('f-preset').onchange(); };
    d.append(b); box.append(d);
    d.querySelectorAll('[data-pm]').forEach(mb => mb.onclick = () => chatWith(p, mb.dataset.pm));
  });
}
document.getElementById('free-only').onchange = loadProv;
document.getElementById('prov-q').oninput = loadProv;
async function chatWith(p, model) {
  const {targets} = await api('GET', '/admin/targets');
  const hit = targets.find(t => (t.models || []).includes(model));
  if (hit) { show('chat'); setChat(hit.name, model); return; }
  if (p.lite) { show('apis');
    const sel = document.getElementById('f-preset');
    sel.value = PRESETS.indexOf(p); sel.onchange();
    if (p.kind) document.getElementById('f-kind').value = p.kind;
    document.getElementById('f-models').value = model;
  } else { alert(p.provider + ': ' + p.note); }
}
let HIST = [];
async function loadChat() {
  const {targets} = await api('GET', '/admin/targets');
  const ts = document.getElementById('c-target');
  ts.innerHTML = '';
  targets.forEach(t => ts.append(new Option(t.name, t.name)));
  fillModels();
}
function fillModels() {
  const t = document.getElementById('c-target').value;
  api('GET', '/admin/targets').then(({targets}) => {
    const hit = targets.find(x => x.name === t);
    const ms = document.getElementById('c-model');
    ms.innerHTML = '';
    (hit ? hit.models : []).forEach(m => ms.append(new Option(m, m)));
  });
}
function setChat(target, model) {
  loadChat().then(() => {
    document.getElementById('c-target').value = target;
    fillModels();
    setTimeout(() => { document.getElementById('c-model').value = model; }, 100);
  });
}
document.getElementById('c-target').onchange = fillModels;
document.getElementById('c-in').onkeydown = e => {
  if (e.key === 'Enter') document.getElementById('c-send').onclick(); };
document.getElementById('c-clear').onclick = () => {
  HIST = []; document.getElementById('c-out').textContent = 'Say hi ↓'; };
document.getElementById('c-send').onclick = async () => {
  const btn = document.getElementById('c-send');
  if (btn.disabled) return;
  const inp = document.getElementById('c-in');
  const text = inp.value.trim();
  if (!text) return;
  const model = document.getElementById('c-model').value;
  HIST.push({role: 'user', content: text});
  inp.value = '';
  btn.disabled = true;
  inp.disabled = true;
  const box = document.getElementById('c-out');
  box.appendChild(document.createTextNode('\n\nYOU: ' + text + '\nAI: '));
  const spin = document.createElement('span');
  spin.className = 'spinner';
  box.appendChild(spin);
  box.scrollTop = box.scrollHeight;
  const rmSpin = () => { if (spin.parentNode) spin.remove(); };
  try {
    const r = await fetch('/v1/chat/completions', {method: 'POST',
      headers: {'Content-Type': 'application/json', ...(K ? {Authorization: 'Bearer ' + K} : {})},
      body: JSON.stringify({model, messages: HIST, stream: true})});
    if (r.status === 401) {
      rmSpin();
      btn.disabled = false;
      inp.disabled = false;
      try { await keyOnce(); } catch (e) { return; }
      HIST.pop();
      inp.value = text;
      document.getElementById('c-send').onclick();
      return;
    }
    if (!r.ok) {
      rmSpin();
      let msg = 'error ' + r.status;
      try { msg = (await r.json()).error.message || msg; } catch (e) {}
      box.appendChild(document.createTextNode('⚠ ' + msg));
      HIST.pop();
      return;
    }
    const rd = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', reply = '';
    for (;;) {
      const part = await rd.read();
      if (part.done) break;
      buf += dec.decode(part.value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const ev = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const line = ev.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const d = line.slice(5).trim();
        if (d === '[DONE]') continue;
        try {
          const c = JSON.parse(d).choices[0].delta.content || '';
          if (c) {
            rmSpin();
            reply += c;
            box.appendChild(document.createTextNode(c));
            box.scrollTop = box.scrollHeight;
          }
        } catch (e) {}
      }
    }
    HIST.push({role: 'assistant', content: reply});
    box.scrollTop = box.scrollHeight;
  } catch (err) {
    rmSpin();
    box.appendChild(document.createTextNode('⚠ ' + (err.message || 'request failed')));
    HIST.pop();
  } finally {
    rmSpin();
    btn.disabled = false;
    inp.disabled = false;
    inp.focus();
  }
};
async function loadLogs() {
  const {logs} = await api('GET', '/admin/logs?limit=100');
  const tb = document.getElementById('l-rows');
  tb.innerHTML = '';
  logs.forEach(e => {
    const t = new Date(e.ts * 1000).toLocaleTimeString();
    tb.insertAdjacentHTML('beforeend',
      `<tr><td>${esc(t)}</td><td>${esc(e.ep)}</td><td>${esc(e.target || '—')}</td><td>${esc(e.model || '—')}</td><td>${e.code}</td><td>${e.ms}</td></tr>`);
  });
  if (!tb.children.length) tb.innerHTML = '<tr><td colspan="6">Quiet so far.</td></tr>';
}
async function loadQuota() {
  const q = await api('GET', '/admin/quota');
  const {targets} = await api('GET', '/admin/targets');
  const provOf = {};
  targets.forEach(t => provOf[t.name] = t.provider || t.name);
  const openProvs = new Set(Object.entries(q.state.breakers).filter(([_, b]) => b.open_s > 0).map(([p]) => p));
  const tb = document.getElementById('q-rows');
  tb.innerHTML = '';
  Object.entries(q.stats.by_target).forEach(([n, v]) => {
    const st = openProvs.has(provOf[n]) ? 'resting' : (q.state.cooldowns[n] ? 'resting ' + q.state.cooldowns[n] + 's' : 'OK');
    tb.insertAdjacentHTML('beforeend', `<tr><td>${esc(n)}</td><td>${v.ok}</td><td>${v.err}</td><td>${v.avg_ms}</td><td>${st}</td></tr>`);
  });
  if (!tb.children.length) tb.innerHTML = '<tr><td colspan="5">No calls yet.</td></tr>';
}
document.getElementById('q-reset').onclick = async () => {
  await api('POST', '/admin/quota', {reset: true}); loadQuota();
};
async function loadKey() {
  const {key, base_url} = await api('GET', '/admin/key');
  if (key) { K = key; localStorage.setItem('k', key); }
  document.getElementById('k-url').textContent = base_url;
  document.getElementById('k-key').textContent = key || 'Open — press New key to lock it down';
}
document.getElementById('k-copy').onclick = async () => {
  const t = document.getElementById('k-key').textContent;
  try { await navigator.clipboard.writeText(t); } catch (e) {
    const ta = document.createElement('textarea'); ta.value = t;
    document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
};
document.getElementById('k-new').onclick = async () => {
  const {key} = await api('POST', '/admin/key/rotate', {});
  K = key; localStorage.setItem('k', key); loadKey();
};
async function loadWeb() {
  const {webhooks} = await api('GET', '/admin/webhooks');
  const box = document.getElementById('w-list');
  box.innerHTML = webhooks.length ? '' : '<div class="card">No webhooks. The server just works quietly.</div>';
  webhooks.forEach(w => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<div class="row"><b class="grow">${esc(w.url)}</b><button data-t="${w.id}">Try</button>` +
      `<button data-d="${w.id}">Remove</button></div><div class="muted">${esc(w.events.join(', '))}</div>`;
    box.append(d);
  });
  box.querySelectorAll('[data-t]').forEach(b => b.onclick = () =>
    api('POST', '/admin/webhooks/' + b.dataset.t + '/test', {}));
  box.querySelectorAll('[data-d]').forEach(b => b.onclick = async () =>
    { await api('DELETE', '/admin/webhooks/' + b.dataset.d); loadWeb(); });
}
document.getElementById('w-add').onclick = async () => {
  const ev = [];
  if (document.getElementById('w-e1').checked) ev.push('breaker_open');
  if (document.getElementById('w-e2').checked) ev.push('all_failed');
  const res = await api('POST', '/admin/webhooks',
    {url: document.getElementById('w-url').value.trim(), events: ev});
  if (res.error) { alert(res.error.message); return; }
  document.getElementById('w-url').value = '';
  loadWeb();
};
async function loadRestart() {
  const st = await api('GET', '/admin/status');
  const s = st.uptime_s;
  document.getElementById('r-up').textContent =
    Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm';
}
document.getElementById('r-btn').onclick = async () => {
  if (!confirm('Restart the server?')) return;
  document.getElementById('r-btn').textContent = 'Restarting…';
  await api('POST', '/admin/restart', {});
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 500));
    try { await fetch('/health'); break; } catch (e) {}
  }
  location.reload();
};
show('home');
setInterval(() => { if (document.getElementById('s-home').classList.contains('on')) loadHome(); }, 5000);
